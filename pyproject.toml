[project]
name = "doubly-even"
version = "0.1.0"
description = "Enumerate doubly even binary linear codes up to permutation equivalence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pynauty>=2.8.8.1",
]

[project.scripts]
dec = "doubly_even.cli:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "maturin>=1.13.3",
]
