[workspace]
members = ["core"]
# The root package (the pyo3 wrapper) is an implicit member. Profiles are
# honored from THIS file only (Cargo ignores [profile.*] in non-root
# members); scripts/microbench/ is intentionally NOT a member — it needs
# its own release profile (debug = true) and its own lockfile.

[package]
name = "doubly-even-kernel"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Python (pyo3) surface of the doubly-even enumerator. Thin wrapper: FFI conversion + the mimalloc global allocator; the algorithms live in core/ (doubly-even-core)."
publish = false

[lib]
name = "doubly_even_kernel"
crate-type = ["cdylib"]

[features]
# Pure 1:1 forwarding to the core crate; internal implications
# (dense_qd_* -> dense_qd, parallel_profiling -> parallel) live in core
# so they hold regardless of which crate enables a flag.
default = []
# Enable the Leon §10(i) paired-refinement equivalence verifier as the
# canon_info secondary-cache fast path. With this off (default), the
# kernel is byte-for-byte identical to the pre-verifier baseline.
equivalence_verifier = ["doubly-even-core/equivalence_verifier"]
# Q6 audit Phase 2 substrate (dormant; all variants benched as net
# regressions vs sparsenauty at our graph shape — see
# `expert-review/05-nauty-traces-audit.md` §5.1):
#   dense_qd               +39 % at N = 22
#   dense_qd_tc0           +42 %
#   dense_qd_refinvar      +260 % (refinvar invariant cost dominates)
# Kept as reproducibility flags; do not enable in production.
dense_qd = ["doubly-even-core/dense_qd"]
dense_qd_refinvar = ["doubly-even-core/dense_qd_refinvar"]
dense_qd_tc0 = ["doubly-even-core/dense_qd_tc0"]
# Q6 audit Phase 3 substrate (dormant; +2 % regression at N = 22, tied
# with sparsenauty within noise). See same audit file.
traces_qd = ["doubly-even-core/traces_qd"]
# D13 outer-DFS parallelism (sequential traversal to a frontier depth,
# then a crossbeam-channel worker pool runs each subtree on its own
# thread). Off by default to keep the dep graph lean and the sequential
# path byte-identical to baseline. Requires `tls` on `nauty-Traces-sys`
# (on by default in core's manifest) so sparsenauty's mutable globals
# are `_Thread_local`. Incompatible with `traces_qd` (compile_error! in
# core) because Traces uses non-TLS static work queues.
# NEVER build with --all-features: parallel x traces_qd is a deliberate
# compile error.
parallel = ["doubly-even-core/parallel"]
# E1/E2 measurement substrate: record per-call sparsenauty elapsed_ns +
# statsblk fields into a global Mutex<Vec> in `canon_info_qd_native`,
# drained from Python via `drain_nauty_hist()`. Off by default; zero
# overhead when off.
nauty_hist = ["doubly-even-core/nauty_hist"]
# Parallel-scaling profile: per-worker (active/idle ns, seed count) and
# per-seed (ns, nodes, emitted) histograms + the 7-tuple seeder
# timeline. Exposed via `enumerate_doubly_even_parallel_with_profile`;
# production builds keep the plain parallel entry untouched. Implies
# `parallel` (in core).
parallel_profiling = ["doubly-even-core/parallel_profiling"]
# Post-D15 profiling instrumentation: σ_Q 5-way sub-phase split + sampled
# φ sub-phase split (every 64th cascade fully timed via the portable
# cycle counter in core's `cycles`). Off by default; the extra stats
# fields are always present in the vector and zero when off. All
# production share figures come from feature-OFF builds — gate:
# wall(on) <= 1.02x wall(off) at N=24 sequential.
phase_timers = ["doubly-even-core/phase_timers"]

[dependencies]
doubly-even-core = { path = "core" }
pyo3 = { version = "0.23", features = ["extension-module"] }
# D13-V4: per-thread allocator pools. canon_info_native + canon_info_qd_native
# allocate ~210 KB of fresh Vecs per call (cw, d, v, e, lab, ptn, orbits, ...).
# Under ptmalloc this thrashes the per-arena lock and L2 across 20 workers;
# mimalloc's per-thread arenas eliminate the lock contention and keep
# freelists hot in L1d.
# `local_dynamic_tls`: mimalloc otherwise compiles with
# -ftls-model=initial-exec, which marks the cdylib STATIC_TLS and makes
# `import doubly_even_kernel` (a dlopen) compete for glibc's ~1.6 KB
# static-TLS surplus — the D16 wheel crossed that line and imports
# started failing with "cannot allocate memory in static TLS block".
# local-dynamic costs one indirection on mimalloc's TLS heap lookup;
# A/B'd at < 1 % on the D16 ship bench.
# The allocator MUST stay in this wrapper crate: in core it would leak
# into every test binary and microbench bin.
#
# Gated on target_os, NOT target_arch: the static-TLS surplus is a
# glibc/dlopen property, so EVERY Linux target keeps the flag — x86_64
# AND aarch64 Linux (the GCP Axion c4a fleet) resolve identically to the
# pre-split line. Only non-Linux (Mach-O on Apple Silicon) drops it,
# where the initial-exec TLS model is harmless and `local_dynamic_tls`
# is untested. Mirrors the OS/arch-gated nauty-Traces-sys split in
# core/Cargo.toml.
[target.'cfg(target_os = "linux")'.dependencies]
mimalloc = { version = "0.1", default-features = false, features = ["local_dynamic_tls"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1

# samply / perf builds (post-D15 profiling): identical codegen to release
# plus line tables for source attribution. Build with
#   RUSTFLAGS="-C force-frame-pointers=yes" CFLAGS="-fno-omit-frame-pointer" \
#     maturin build --profile profiling -m rust/Cargo.toml --features parallel
# (the CFLAGS reaches the bundled nauty C via the cc crate — needs a clean
# rebuild of nauty-Traces-sys to take effect.)
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
