[package]
name = "doubly-even-kernel"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native hot kernel for the doubly-even enumerator (σ_Q tables, singular BFS, orbit-min)"
publish = false

[lib]
name = "doubly_even_kernel"
crate-type = ["cdylib", "rlib"]

[features]
default = ["t11_cache"]
# Enable the Leon §10(i) paired-refinement equivalence verifier as the
# canon_info secondary-cache fast path. With this off (default), the
# kernel is byte-for-byte identical to the pre-verifier baseline.
equivalence_verifier = []
# Q6 audit Phase 2 substrate (dormant; all variants benched as net
# regressions vs sparsenauty at our graph shape — see
# `expert-review/05-nauty-traces-audit.md` §5.1):
#   dense_qd               +39 % at N = 22
#   dense_qd_tc0           +42 %
#   dense_qd_refinvar      +260 % (refinvar invariant cost dominates)
# Kept as reproducibility flags; do not enable in production.
dense_qd = []
dense_qd_refinvar = ["dense_qd"]
dense_qd_tc0 = ["dense_qd"]
# Q6 audit Phase 3 substrate (dormant; +2 % regression at N = 22, tied
# with sparsenauty within noise). See same audit file.
traces_qd = []
# D13 outer-DFS parallelism (sequential traversal to depth 3, then a
# crossbeam-channel worker pool runs each subtree on its own thread).
# Off by default to keep the dep graph lean and the sequential path
# byte-identical to baseline. Requires `tls` on `nauty-Traces-sys`
# (already on by default in this manifest) so sparsenauty's mutable
# globals are `_Thread_local`. Incompatible with `traces_qd` because
# Traces uses non-TLS static work queues.
parallel = ["dep:crossbeam-channel"]
# Class-fingerprint cache: per-worker FxHashMap keyed by `compute_t11_hash(D)`,
# storing only the class-invariant `parent_class_t11 = T11(canonical_parent(D))`.
# Dispatch lives in `traverse`/`traverse_seed` BEFORE `canon_info(D)`; on a
# cache hit where the cached value disagrees with the caller's hash_c =
# T11(class(C)), the candidate is cheap-rejected without invoking nauty.
# Blocklisted hashes (`t11_blocklist::*`, extracted offline by
# `dump_t11_blocklist.py`) are never populated and always fall through to
# nauty. Default OFF during initial integration; debug builds assert every
# cheap-reject against a full recomputation. Supersedes the earlier
# σ-storing T11 cache tier (deleted; was unsound — see plan file
# `implement-and-bench-the-logical-lovelace.md`).
t11_cache = ["dep:rustc-hash"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
fixedbitset = "0.5"
nauty-Traces-sys = { version = "0.11", default-features = false, features = ["bundled", "tls", "popcnt"] }
crossbeam-channel = { version = "0.5", optional = true }
# Fixed-seed deterministic hasher for the T11 cache key (under
# `t11_cache` feature). Same hasher as rustc itself; byte-stable.
rustc-hash = { version = "2", optional = true }
# Bounded LRU for the per-worker canon cache. At N ≥ 26 the canon
# cache grows unbounded without this — N=26 with 20 workers hit the
# 48 GB cgroup OOM. Hit rate is only 3–5 %, but each hit saves ~80 µs,
# so we cap rather than drop. Default cap 500K entries (~500 MB at
# N=26); env-tunable via `DOUBLY_EVEN_CANON_CACHE_CAP`.
lru = "0.12"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"] }

[[bench]]
name = "candidates"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
