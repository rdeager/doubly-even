[package]
name = "doubly-even-kernel"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native hot kernel for the doubly-even enumerator (σ_Q tables, singular BFS, orbit-min)"
publish = false

[lib]
name = "doubly_even_kernel"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Enable the Leon §10(i) paired-refinement equivalence verifier as the
# canon_info secondary-cache fast path. With this off (default), the
# kernel is byte-for-byte identical to the pre-verifier baseline.
equivalence_verifier = []
# Q6 audit Phase 2 substrate (dormant; all variants benched as net
# regressions vs sparsenauty at our graph shape — see
# `expert-review/05-nauty-traces-audit.md` §5.1):
#   dense_qd               +39 % at N = 22
#   dense_qd_tc0           +42 %
#   dense_qd_refinvar      +260 % (refinvar invariant cost dominates)
# Kept as reproducibility flags; do not enable in production.
dense_qd = []
dense_qd_refinvar = ["dense_qd"]
dense_qd_tc0 = ["dense_qd"]
# Q6 audit Phase 3 substrate (dormant; +2 % regression at N = 22, tied
# with sparsenauty within noise). See same audit file.
traces_qd = []
# D13 outer-DFS parallelism (sequential traversal to depth 3, then a
# crossbeam-channel worker pool runs each subtree on its own thread).
# Off by default to keep the dep graph lean and the sequential path
# byte-identical to baseline. Requires `tls` on `nauty-Traces-sys`
# (already on by default in this manifest) so sparsenauty's mutable
# globals are `_Thread_local`. Incompatible with `traces_qd` because
# Traces uses non-TLS static work queues.
parallel = ["dep:crossbeam-channel"]
# E1/E2 measurement substrate (research-plan
# `any-speed-improvement-to-tender-wave`): record per-call sparsenauty
# elapsed_ns + statsblk fields into a global Mutex<Vec> in
# `canon_info_qd_native`, drained from Python via `drain_nauty_hist()`.
# Off by default; zero overhead when off. Used to measure mean nauty
# cost split by easy (numnodes=1) vs hard (numnodes>1) buckets.
nauty_hist = []
# Phase 3 parallel-scaling profile: extend the D13 parallel kernel
# with per-worker (active/idle ns, seed count) and per-seed (ns,
# nodes, emitted) histograms. Exposed via a separate entry point
# `enumerate_doubly_even_parallel_with_profile`; production builds
# keep the original `enumerate_doubly_even_parallel` untouched. Off
# by default; only used for the scaling-diagnosis sweep in
# `markdown/architecture/07-parallel-scaling-profile.md`. Implies
# `parallel`.
parallel_profiling = ["parallel"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
fixedbitset = "0.5"
crossbeam-channel = { version = "0.5", optional = true }
# Bounded LRU for the per-worker canon cache. At N ≥ 26 the canon
# cache grows unbounded without this — N=26 with 20 workers hit the
# 48 GB cgroup OOM. Hit rate is only 3–5 %, but each hit saves ~80 µs,
# so we cap rather than drop. Default cap 500K entries (~500 MB at
# N=26); env-tunable via `DOUBLY_EVEN_CANON_CACHE_CAP`.
lru = "0.12"
# D13-V4: per-thread allocator pools. canon_info_native + canon_info_qd_native
# allocate ~210 KB of fresh Vecs per call (cw, d, v, e, lab, ptn, orbits, ...).
# Under ptmalloc this thrashes the per-arena lock and L2 across 20 workers;
# mimalloc's per-thread arenas eliminate the lock contention and keep
# freelists hot in L1d.
mimalloc = { version = "0.1", default-features = false }

# `nauty-Traces-sys 0.11` is target-conditional: its `build.rs:205` calls
# `is_x86_feature_detected!("popcnt")` unconditionally, which the Rust
# compiler refuses on non-x86 targets. On aarch64 we drop the `popcnt`
# feature; nauty's C source then uses `__builtin_popcountl`, which
# compiles to the universal aarch64 `CNT` instruction (single-cycle on
# Neoverse V2). Zero performance impact — confirmed during the 2026-05-21
# c4a-standard-72 N=28 deploy: per-call cost 37.7 µs at N=28 matches the
# x86_64 model 1:1 modulo per-thread clock ratio.
[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
nauty-Traces-sys = { version = "0.11", default-features = false, features = ["bundled", "tls", "popcnt"] }

[target.'cfg(not(any(target_arch = "x86", target_arch = "x86_64")))'.dependencies]
nauty-Traces-sys = { version = "0.11", default-features = false, features = ["bundled", "tls"] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"] }

[[bench]]
name = "candidates"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
